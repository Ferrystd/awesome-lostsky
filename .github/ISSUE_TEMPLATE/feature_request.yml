name: 需求建议
description: 提交新功能、体验优化或现有能力改进建议
title: "[需求] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 LostSky 提出建议。请尽量说明要解决的问题和可验证的结果，而不只是实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 当前遇到了什么问题？谁会在什么场景下受到影响？
      placeholder: 请描述使用场景、现状和痛点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望 LostSky 如何解决这个问题？
      placeholder: 请描述期望的交互、流程或结果。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些条件时，可以认为这个需求已经完成？
      placeholder: |
        - 当……时，可以……
        - 用户能够……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否尝试过其他解决办法？它们有哪些不足？

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附上截图、原型、相关链接或其他背景资料。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的需求。
          required: true
        - label: 此 Issue 不包含密码、Token、Cookie、个人信息或内部地址。
          required: true
