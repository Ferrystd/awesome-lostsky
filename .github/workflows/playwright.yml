name: Test Suite
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lostsky
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo_mysql, fileinfo
        coverage: none
    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist
    - name: Configure test environment
      run: |
        cp .env.example .env
        printf '\nDB_HOST = 127.0.0.1\nDB_NAME = lostsky\nDB_USER = root\nDB_PASS = root\njwt.secret = ci-only-jwt-secret-with-at-least-32-characters\n' >> .env
    - name: Import schema
      run: mysql -h 127.0.0.1 -uroot -proot lostsky < sql/schema.sql
    - name: PHP syntax
      run: find app config route tests -name '*.php' -print0 | xargs -0 -n1 php -l
    - name: Backend integration tests
      run: npm run test:backend

  frontend:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: npm ci && npm run docs:setup
    - name: Unit tests
      run: npm test
    - name: Typecheck and regenerate API types
      run: npm run typecheck
    - name: Validate media and CORS contracts
      run: npm run check:media && npm run check:cors
    - name: Production builds
      run: npm run build && npm run build:docs
    - name: Verify static outputs
      shell: bash
      run: |
        test -s docs/dev/index.md
        test -s docs/user/index.md
        test -s docs/user/.obsidian/app.json
        test ! -e .obsidian
        test ! -e docs/manual
        for domain in www account admin team chat transaction display shop; do
          test -s "www/${domain}.lostsky.work/index.html"
          test -n "$(find "www/assets.lostsky.work/build/${domain}" -type f -print -quit)"
        done
        test -s www/docs.lostsky.work/index.html
        test -s www/doc.lostsky.work/index.html
        test -d www/assets.lostsky.work/media
        git check-ignore -q www/account.lostsky.work/index.html
        git check-ignore -q www/assets.lostsky.work/build/site/
        git check-ignore -q www/assets.lostsky.work/media/
        git check-ignore -q www/docs.lostsky.work/index.html
        git check-ignore -q www/doc.lostsky.work/index.html
        if git ls-files -- \
          'www/www.lostsky.work/**' \
          'www/account.lostsky.work/**' \
          'www/admin.lostsky.work/**' \
          'www/team.lostsky.work/**' \
          'www/chat.lostsky.work/**' \
          'www/transaction.lostsky.work/**' \
          'www/display.lostsky.work/**' \
          'www/shop.lostsky.work/**' \
          'www/assets.lostsky.work/build/**' \
          'www/assets.lostsky.work/media/**' \
          'www/docs.lostsky.work/**' \
          'www/doc.lostsky.work/**' | grep -q .; then
          echo 'Reproducible static outputs must not be tracked.' >&2
          exit 1
        fi
        git ls-files --error-unmatch \
          www/assets.lostsky.work/css/base.css \
          www/assets.lostsky.work/js/api.js \
          www/assets.lostsky.work/images/site-bg.png >/dev/null
    - name: Verify generated sources are committed
      run: git diff --exit-code
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Map LostSky development subdomains
      run: |
        echo '127.0.0.1 www.lostsky.work account.lostsky.work demo.team.lostsky.work demo.chat.lostsky.work demo.transaction.lostsky.work demo.display.lostsky.work' | sudo tee -a /etc/hosts
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
