# LostSky documentation sites.
#
# - docs.lostsky.work -> complete project documentation
# - doc.lostsky.work  -> user guide only
#
# Both sites are static Zensical outputs. Missing paths must use the generated
# 404 page instead of the Vue history fallback used by LostSky applications.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.lostsky.work;

    ssl_certificate /etc/letsencrypt/live/lostsky.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostsky.work/privkey.pem;

    root /www/deploy/lostsky/www/docs.lostsky.work;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doc.lostsky.work;

    ssl_certificate /etc/letsencrypt/live/lostsky.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostsky.work/privkey.pem;

    root /www/deploy/lostsky/www/doc.lostsky.work;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
