# LostSky static frontend wildcard template.
#
# Domain mapping:
# - admin.lostsky.work      -> www/admin.lostsky.work
# - team.lostsky.work       -> www/team.lostsky.work
# - demo.team.lostsky.work  -> www/team.lostsky.work, slug = demo
# - any.app.lostsky.work    -> www/app.lostsky.work, slug = any
#
# docs.lostsky.work and doc.lostsky.work use the exact static-site blocks in
# lostsky-docs.conf so missing documentation paths do not receive a Vue fallback.
#
# Keep api.lostsky.work in its own exact backend server block. Exact server_name
# matching has higher priority than these regex names. The regex also excludes
# app = api as a fallback guard.

# Shared CDN assets are loaded by every LostSky subdomain. ES modules, fonts,
# media elements using crossorigin, and canvas-backed images all require an
# explicit CORS response from this host.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assets.lostsky.work;

    ssl_certificate /etc/letsencrypt/live/lostsky.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostsky.work/privkey.pem;

    root /var/www/lostsky-website/www/assets.lostsky.work;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ~* \.(?:mp4|webm|ogg)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Accept-Ranges "bytes" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name
        ~^(?<slug>[a-z0-9-]+)\.(?<app>(?!api$)[a-z0-9-]+)\.lostsky\.work$
        ~^(?<app>(?!api$)[a-z0-9-]+)\.lostsky\.work$;

    ssl_certificate /etc/letsencrypt/live/lostsky.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostsky.work/privkey.pem;

    if ($host ~* (^|\.)api\.lostsky\.work$) {
        return 404;
    }

    root /var/www/lostsky-website/www/$app.lostsky.work;
    index index.html;

    # Vue history fallback: every application route uses the single index.html entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets should never fall through to HTML routing.
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }
}
