; LostSky production PHP-FPM overrides.
; Install this file into the PHP-FPM conf.d directory, then create upload_tmp_dir
; with ownership matching the PHP-FPM worker account.

upload_tmp_dir=/var/lib/lostsky/upload-tmp
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/var/log/php/lostsky-error.log
html_errors=Off
