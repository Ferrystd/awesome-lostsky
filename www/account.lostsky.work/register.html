<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - 失落青空</title>
    <meta name="description" content="注册失落青空通行证，开启您的工作台体验">
    <meta property="og:title" content="注册 - 失落青空">
    <meta property="og:description" content="注册失落青空通行证，开启您的工作台体验">
    <meta property="og:image" content="//assets.lostsky.work/images/site-bg.png">
    <link rel="canonical" href="https://account.lostsky.work/register.html">
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-register.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white min-h-screen flex items-center justify-center p-4">

    <!-- 背景 -->
    <div class="fixed inset-0 z-[-1] bg-fixed-image opacity-40 mix-blend-screen"></div>
    <div class="fixed inset-0 z-[-1] bg-gradient-to-b from-transparent via-[#020617]/80 to-[#020617]"></div>

    <!-- 注册主面板 -->
    <div class="w-full max-w-md glass-panel rounded-2xl overflow-hidden shadow-[0_0_40px_rgba(14,165,233,0.1)] fade-in-element visible relative">
        <!-- 扫光装饰 -->
        <div class="absolute inset-0 pointer-events-none shimmer-sweep opacity-50"></div>
        
        <div class="p-8 sm:p-10 relative z-10">
            <!-- Logo & 标题 -->
            <div class="text-center mb-8">
                <a href="//www.lostsky.work" class="inline-block text-3xl font-bold tracking-wider text-white mb-2 hover:scale-105 transition-transform">
                    失落<span class="text-primary">青空</span>
                </a>
                <p class="text-gray-400 text-sm">创建您的工作台通行证</p>
            </div>

            <!-- 错误提示容器 -->
            <div id="error-alert" class="hidden mb-6 p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-center gap-2 text-red-400 text-sm">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span id="error-message"></span>
            </div>

            <!-- 注册表单 -->
            <form id="register-form" class="space-y-5" onsubmit="handleRegister(event)">
                
                <!-- 手机号输入框 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">手机号码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <!-- Phone Icon -->
                            <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </div>
                        <input type="text" id="input-phone" required
                            class="page-register-input block w-full pl-10 pr-3 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:ring-1 focus:ring-primary focus:border-primary transition-colors sm:text-sm"
                            placeholder="请输入手机号码">
                    </div>
                </div>

                <!-- 密码输入框 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">设置密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <!-- Lock Icon -->
                            <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="input-password" required minlength="6"
                            class="page-register-input block w-full pl-10 pr-10 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:ring-1 focus:ring-primary focus:border-primary transition-colors sm:text-sm"
                            placeholder="长度 6-32 位">
                        
                        <!-- Toggle Password Visibility -->
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <button type="button" onclick="togglePassword()" class="text-gray-500 hover:text-gray-300 focus:outline-none transition-colors">
                                <svg id="icon-eye-closed" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0l-3.59-3.59m-1.59-1.59L3 3" />
                                </svg>
                                <svg id="icon-eye-open" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 协议勾选 -->
                <div class="flex items-start mt-4">
                    <div class="flex items-center h-5">
                        <input id="agreement" type="checkbox" required class="page-register-checkbox w-4 h-4 rounded border-gray-600 bg-white/5 text-primary focus:ring-primary focus:ring-offset-gray-900 focus:ring-offset-2 flex-shrink-0 cursor-pointer">
                    </div>
                    <label for="agreement" class="ml-2 block text-xs text-gray-400 cursor-pointer">
                        我已阅读并同意
                        <a href="#" class="text-primary hover:text-primary/80 transition-colors">《用户服务协议》</a>
                        与
                        <a href="#" class="text-primary hover:text-primary/80 transition-colors">《隐私政策》</a>
                    </label>
                </div>

                <!-- 提交按钮 -->
                <div class="pt-2">
                    <button type="submit" id="btn-submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-gradient-to-r from-primary to-secondary hover:shadow-[0_0_20px_rgba(14,165,233,0.4)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-primary transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span id="btn-text">注册并登录</span>
                        <!-- Loading Spinner -->
                        <svg id="btn-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>
            
            <!-- 返回登录 -->
            <div class="mt-6 text-center text-sm">
                <span class="text-gray-400">已有账号？</span>
                <a href="/login.html" class="font-medium text-primary hover:text-primary/80 transition-colors">立即登录</a>
            </div>
        </div>
    </div>

    <!-- API 模块及页面逻辑 -->
    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-register.js"></script>
</body>
</html>
