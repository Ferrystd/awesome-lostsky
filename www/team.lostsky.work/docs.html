<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档库 - 失落青空管理后台</title>
    <meta name="description" content="创建、检索和维护团队与成员文档。">
    <meta property="og:title" content="文档库 - 失落青空管理后台">
    <meta property="og:description" content="管理失落青空团队和成员文档内容。">
    <meta property="og:image" content="//assets.lostsky.work/images/site-bg.png">
    <link rel="canonical" href="https://team.lostsky.work/docs">
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-sky-100 selection:text-sky-900 bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 flex-shrink-0">
            <a href="/" class="flex items-center gap-3" aria-label="团队控制台">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-sky-50 text-sky-600 border border-sky-100">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-9h-6v9zm0-13h6V4h-6v3z"></path></svg>
                </span>
                <span>
                    <span class="block text-base font-semibold text-slate-950">LostSky Team</span>
                    <span class="block text-xs text-slate-500">团队后台</span>
                </span>
            </a>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 admin-scroll" aria-label="团队后台导航">
            <div class="px-3 mb-6">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-9h-6v9zm0-13h6V4h-6v3z"></path></svg>
                    仪表盘
                </a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11a4 4 0 10-8 0m8 0a4 4 0 01-8 0M4 20a8 8 0 0116 0"></path></svg>
                    成员管理
                </a>
                <a href="/join-review" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11a4 4 0 10-8 0m8 0a4 4 0 01-8 0M5 20a7 7 0 0114 0"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M18 8l2 2 3-4"></path></svg>
                    加入审核
                </a>
                <a href="/notice" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 8.5v7A2.5 2.5 0 0118.5 18h-13A2.5 2.5 0 013 15.5v-7A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 8l8 5 8-5"></path></svg>
                    站内信
                </a>
            </div>

            <div class="px-3 mb-6">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 7.5v9A2.5 2.5 0 0117.5 19h-11A2.5 2.5 0 014 16.5v-9A2.5 2.5 0 016.5 5H9l1.4 2h7.1A2.5 2.5 0 0120 7.5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 13h8"></path></svg>
                    岗位类型
                </a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 5h8M8 12h8M8 19h8"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.5 5h.01M4.5 12h.01M4.5 19h.01"></path></svg>
                    自定义字段
                </a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.5 7.5A2.5 2.5 0 016 5h4l2 2h6A2.5 2.5 0 0120.5 9.5v7A2.5 2.5 0 0118 19H6a2.5 2.5 0 01-2.5-2.5v-9z"></path></svg>
                    文件库
                </a>
                <a href="/docs" class="sidebar-link active flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 4h7l4 4v12H7a2 2 0 01-2-2V6a2 2 0 012-2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14 4v5h5M9 13h6M9 17h6"></path></svg>
                    文档库
                </a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19.4 15a1.8 1.8 0 00.36 1.98l.05.05a2.1 2.1 0 01-2.97 2.97l-.05-.05a1.8 1.8 0 00-1.98-.36 1.8 1.8 0 00-1.1 1.66V21a2.1 2.1 0 01-4.2 0v-.08A1.8 1.8 0 008.4 19.3a1.8 1.8 0 00-1.98.36l-.05.05A2.1 2.1 0 013.4 16.74l.05-.05a1.8 1.8 0 00.36-1.98 1.8 1.8 0 00-1.66-1.1H2a2.1 2.1 0 010-4.2h.08A1.8 1.8 0 003.7 8.3a1.8 1.8 0 00-.36-1.98l-.05-.05A2.1 2.1 0 016.26 3.3l.05.05a1.8 1.8 0 001.98.36h.01A1.8 1.8 0 009.4 2.08V2a2.1 2.1 0 014.2 0v.08a1.8 1.8 0 001.1 1.66 1.8 1.8 0 001.98-.36l.05-.05A2.1 2.1 0 0119.7 6.3l-.05.05a1.8 1.8 0 00-.36 1.98 1.8 1.8 0 001.66 1.1H21a2.1 2.1 0 010 4.2h-.08A1.8 1.8 0 0019.4 15z"></path></svg>
                    团队设置
                </a>
            </div>

            <div class="px-3">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 12a4 4 0 100-8 4 4 0 000 8z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 20a8 8 0 0116 0"></path></svg>
                    我的资料
                </a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-slate-200 bg-white z-10 flex-shrink-0">
            <div class="flex items-center min-w-0">
                <button id="mobile-menu-btn" class="md:hidden inline-flex h-11 w-11 items-center justify-center -ml-2 mr-2 text-slate-500 rounded-lg hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" aria-label="打开菜单">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm truncate">
                    <a href="/" class="text-slate-500 hover:text-slate-700 transition-colors">仪表盘</a>
                    <span class="mx-2 text-slate-300">/</span>
                    <span class="text-slate-950 font-medium">文档库</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4">
                    <div>
                        <h1 class="text-2xl font-semibold mb-1">文档库</h1>
                        <p class="text-sm text-slate-500" id="doc-summary">正在鍚屾文档索引...</p>
                    </div>
                    <button onclick="openDocumentModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">新增文档</button>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm mb-6 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-[180px_220px_minmax(0,1fr)_180px_auto] gap-4 items-center">
                    <select id="target-type" class="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
                        <option value="team">团队文档</option>
                        <option value="teamMember">成员文档</option>
                    </select>
                    <div id="target-member-wrap" class="hidden">
                        <select id="target-member" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"></select>
                    </div>
                    <input type="text" id="filter-keyword" placeholder="搜索文档标题..." class="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 placeholder-slate-400">
                    <select id="filter-visibility" class="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
                        <option value="">全部可见范围</option>
                        <option value="1">团队管理可见</option>
                        <option value="2">团队管理可见，不含成员本人</option>
                        <option value="3">成员本人和团队管理可见</option>
                        <option value="4">团队成员可见</option>
                        <option value="5">公开可见</option>
                    </select>
                    <button onclick="loadDocuments(1)" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">检索</button>
                </div>

                <section id="doc-list" class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-4"></section>
                <div class="mt-6 flex justify-center gap-2" id="pagination"></div>
            </div>
        </div>
    </main>

    <div id="doc-modal" class="modal-overlay bg-slate-950/50 backdrop-blur-sm">
        <div class="modal-content w-full max-w-5xl rounded-2xl border border-slate-200 bg-white shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b border-slate-200">
                <h2 class="text-xl font-semibold" id="modal-title">新增文档</h2>
                <button onclick="closeModal('doc-modal')" class="text-slate-500 hover:text-slate-950 transition-colors" aria-label="关闭">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto admin-scroll">
                <form id="doc-form" class="space-y-5">
                    <input type="hidden" id="form-id">
                    <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_140px_220px_220px] gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">文档标题 <span class="text-red-400">*</span></label>
                            <input type="text" id="form-title" required maxlength="255" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400" placeholder="例如：新人入队流程">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">排序鍊?/label>
                            <input type="number" id="form-sort" value="0" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors">
                        </div>
                        <div id="form-manager-wrap">
                            <label class="block text-sm font-medium text-slate-700 mb-2">管理范围</label>
                            <select id="form-manager-scope" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
                                <option value="1">团队管理</option>
                                <option value="2">成员本人和团队管理</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">可见范围</label>
                            <select id="form-visibility" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Markdown 内容</label>
                            <textarea id="form-content" rows="18" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400 font-mono text-sm leading-6 resize-y" placeholder="# 标题&#10;&#10;- 待办事项&#10;- 说明内容"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">实时棰勮</label>
                            <div id="form-preview" class="admin-scroll overflow-y-auto min-h-[432px] max-h-[520px] bg-slate-50 border border-slate-200 rounded-lg px-5 py-4 text-slate-700 leading-7"></div>
                        </div>
                    </div>

                    <div id="form-error" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-200 flex justify-end gap-3 bg-slate-50">
                <button type="button" onclick="closeModal('doc-modal')" class="px-5 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-950 hover:bg-slate-50 transition-colors">取消</button>
                <button type="button" onclick="submitDocumentForm()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">保存文档</button>
            </div>
        </div>
    </div>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script src="//assets.lostsky.work/js/page-docs.js"></script>
</body>
</html>
