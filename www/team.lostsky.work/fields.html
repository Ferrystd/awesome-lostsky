<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义字段 - 失落青空管理后台</title>
    <meta name="description" content="配置团队成员自定义字段、输入控件和编辑权限。">
    <meta property="og:title" content="自定义字段 - 失落青空管理后台">
    <meta property="og:description" content="配置团队成员自定义字段。">
    <meta property="og:image" content="//assets.lostsky.work/images/site-bg.png">
    <link rel="canonical" href="https://team.lostsky.work/fields">
    <!-- CSS & Tailwind -->
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">仪表盘</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">自定义字段</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element flex flex-col h-full">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-1">自定义字段</h2>
                        <p class="text-sm text-gray-400">可为成员模型追加额外的数据字段，如微信、接单价等。</p>
                    </div>
                    <button onclick="openFieldModal()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors tech-border-glow shadow-[0_0_15px_rgba(14,165,233,0.3)]">
                        + 添加字段
                    </button>
                </div>

                <div class="glass-panel rounded-2xl overflow-hidden flex-1 flex flex-col border border-white/5">
                    <div class="overflow-x-auto">
                        <table class="admin-table min-w-[800px]">
                            <thead>
                                <tr>
                                    <th>展示名称</th>
                                    <th>标识(Key)</th>
                                    <th>字段类型</th>
                                    <th>输入控件</th>
                                    <th>是否必填</th>
                                    <th class="text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="field-table-body">
                                <tr><td colspan="6" class="text-center py-8 text-gray-500">正在加载数据...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div id="field-modal" class="modal-overlay glass-overlay">
        <div class="modal-content w-full max-w-2xl glass-panel rounded-2xl border border-white/10 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b border-white/5">
                <h3 class="text-xl font-bold" id="modal-title">添加字段</h3>
                <button onclick="closeModal('field-modal')" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto admin-scroll">
                <form id="field-form" class="space-y-5">
                    <input type="hidden" id="form-id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">展示名称 <span class="text-red-400">*</span></label>
                            <input type="text" id="form-name" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600" placeholder="如: 微信号">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">字段标识(Key) <span class="text-red-400">*</span></label>
                            <input type="text" id="form-key" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600" placeholder="如: wechat_id">
                            <p class="text-xs text-gray-500 mt-1">仅允许英文字母和下划线</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">数据存储类型</label>
                            <select id="form-value-type" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                                <option value="string">文本(String)</option>
                                <option value="text">长文本(Text)</option>
                                <option value="int">整数(Int)</option>
                                <option value="decimal">浮点数(Decimal)</option>
                                <option value="bool">布尔值(Bool)</option>
                                <option value="date">日期(Date)</option>
                                <option value="datetime">时间(DateTime)</option>
                                <option value="select">单选值(Select)</option>
                                <option value="multi_select">多选值(Multi Select)</option>
                                <option value="json">JSON</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">前端输入控件</label>
                            <select id="form-input-type" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                                <option value="text">单行输入框 (text)</option>
                                <option value="textarea">多行输入框 (textarea)</option>
                                <option value="radio">单选按钮 (radio)</option>
                                <option value="checkbox">复选框 (checkbox)</option>
                                <option value="select">下拉选择 (select)</option>
                                <option value="date">日期选择 (date)</option>
                                <option value="datetime">日期时间选择 (datetime)</option>
                                <option value="upload">文件上传 (upload)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">选项配置 (JSON格式，仅下拉等控件需要)</label>
                        <textarea id="form-options" rows="2" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary placeholder-gray-600 font-mono text-xs" placeholder='[{"label":"选项1","value":"1"}]'></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/5">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="form-is-required" class="sr-only peer">
                            <div class="page-team-switch page-team-switch-sm"></div>
                            <span class="ml-3 text-sm text-gray-300">是否必填</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="form-is-editable" class="sr-only peer" checked>
                            <div class="page-team-switch page-team-switch-sm"></div>
                            <span class="ml-3 text-sm text-gray-300">允许编辑</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="form-is-searchable" class="sr-only peer">
                            <div class="page-team-switch page-team-switch-sm"></div>
                            <span class="ml-3 text-sm text-gray-300">可作为搜索条件</span>
                        </label>
                    </div>

                    <div id="form-error" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                </form>
            </div>
            
            <div class="p-6 border-t border-white/5 flex justify-end gap-3 bg-black/20">
                <button type="button" onclick="closeModal('field-modal')" class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-colors">取消</button>
                <button type="button" onclick="submitFieldForm()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                    保存字段
                </button>
            </div>
        </div>
    </div>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let allFields = [];

        async function loadFields() {
            const tbody = document.getElementById('field-table-body');
            try {
                // apiGet 返回的是 json.data，即字段数组
                const res = await window.apiGet('/memberField/index');
                allFields = res || [];
                renderTable(allFields);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-400">网络异常</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('field-table-body');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">暂无自定义字段</td></tr>`;
                return;
            }
            
            tbody.innerHTML = data.map(f => `
                <tr>
                    <td class="font-medium text-white">${f.name}</td>
                    <td class="font-mono text-sm text-gray-400">${f.field_key}</td>
                    <td><span class="px-2 py-1 bg-white/5 rounded text-xs">${f.value_type}</span></td>
                    <td><span class="px-2 py-1 bg-white/5 rounded text-xs">${f.input_type}</span></td>
                    <td>
                        ${f.is_required 
                            ? `<span class="text-orange-400 text-xs">必填</span>` 
                            : `<span class="text-gray-500 text-xs">选填</span>`}
                    </td>
                    <td class="text-right">
                        <button onclick="editField(${f.id})" class="text-primary hover:text-primary/80 text-sm font-medium mr-3 transition-colors">编辑</button>
                        ${f.is_system ? `<span class="text-gray-600 text-sm line-through" title="系统保留字段，不可删">删除</span>` : `<button onclick="deleteField(${f.id})" class="text-red-400 hover:text-red-300 text-sm font-medium transition-colors">删除</button>`}
                    </td>
                </tr>
            `).join('');
        }

        function openFieldModal(field = null) {
            const isEdit = !!field;
            document.getElementById('modal-title').textContent = isEdit ? '编辑字段' : '新增字段';
            document.getElementById('form-id').value = isEdit ? field.id : '';
            
            document.getElementById('form-name').value = isEdit ? field.name : '';
            document.getElementById('form-key').value = isEdit ? field.field_key : '';
            document.getElementById('form-key').disabled = isEdit; // 编辑时不允许改key
            
            document.getElementById('form-value-type').value = isEdit ? field.value_type : 'string';
            document.getElementById('form-input-type').value = isEdit ? field.input_type : 'text';
            
            try {
                document.getElementById('form-options').value = isEdit && field.options ? JSON.stringify(field.options) : '';
            } catch(e) { document.getElementById('form-options').value = ''; }
            
            document.getElementById('form-is-required').checked = isEdit ? field.is_required : false;
            document.getElementById('form-is-editable').checked = isEdit ? field.is_editable : true;
            document.getElementById('form-is-searchable').checked = isEdit ? field.is_searchable : false;
            
            document.getElementById('form-error').classList.add('hidden');
            window.openModal('field-modal');
        }

        document.getElementById('form-value-type').addEventListener('change', (event) => {
            const valueType = event.target.value;
            const inputTypeEl = document.getElementById('form-input-type');
            if (valueType === 'bool') {
                inputTypeEl.value = 'checkbox';
            } else if (valueType === 'date') {
                inputTypeEl.value = 'date';
            } else if (valueType === 'datetime') {
                inputTypeEl.value = 'datetime';
            } else if (valueType === 'multi_select') {
                inputTypeEl.value = 'checkbox';
            }
        });

        document.getElementById('form-input-type').addEventListener('change', (event) => {
            if (event.target.value === 'upload') {
                document.getElementById('form-value-type').value = 'string';
            }
        });

        function editField(id) {
            const field = allFields.find(f => f.id === id);
            if (field) openFieldModal(field);
        }

        async function submitFieldForm() {
            const id = document.getElementById('form-id').value;
            const errorEl = document.getElementById('form-error');
            
            const payload = {
                name: document.getElementById('form-name').value,
                field_key: document.getElementById('form-key').value,
                value_type: document.getElementById('form-value-type').value,
                input_type: document.getElementById('form-input-type').value,
                is_required: document.getElementById('form-is-required').checked ? 1 : 0,
                is_editable: document.getElementById('form-is-editable').checked ? 1 : 0,
                is_searchable: document.getElementById('form-is-searchable').checked ? 1 : 0,
                source: 'custom',
                visibility: 1,
                manager_scope: 1,
                sort: 0
            };

            const optStr = document.getElementById('form-options').value.trim();
            if (optStr) {
                try {
                    payload.options = JSON.parse(optStr);
                } catch(e) {
                    errorEl.textContent = '选项配置必须是合法的JSON';
                    errorEl.classList.remove('hidden');
                    return;
                }
            } else {
                payload.options = null;
            }

            if (!payload.name || !payload.field_key) {
                errorEl.textContent = '名称和标识为必填项';
                errorEl.classList.remove('hidden');
                return;
            }

            const endpoint = id ? '/memberField/edit' : '/memberField/add';
            if (id) payload.id = parseInt(id);

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost(endpoint, payload);
                window.closeModal('field-modal');
                loadFields();
            } catch (err) {
                errorEl.textContent = err.message || '操作失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function deleteField(id) {
            if (!confirm('确定删除该字段？该操作会导致所有成员录入的此字段值一并删除！')) return;
            try {
                await window.apiPost('/memberField/delete', { id });
                loadFields();
            } catch (e) { alert(e.message || '操作失败'); }
        }

        document.addEventListener('DOMContentLoaded', loadFields);
    </script>
</body>
</html>
