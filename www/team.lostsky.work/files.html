        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">

                        <h2 class="text-2xl font-semibold mb-1">团队文件库</h2>
                        <p class="text-sm text-slate-500" id="file-usage-info">总空间用量统计中...</p>
                    </div>
                    <div>
                        <input type="file" id="file-upload-input" class="hidden" multiple onchange="uploadFiles()">
                        <button onclick="document.getElementById('file-upload-input').click()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                            上传文件
                        </button>
                    </div>
                </div>

                <!-- 筛选区 -->
                <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm mb-6 flex flex-wrap gap-4 items-center">
                    <input type="text" id="filter-keyword" placeholder="搜索文件鍚?.." class="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 placeholder-slate-400">
                    <select id="filter-mime" class="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
                        <option value="">所有文件类型</option>
                        <option value="image/">图片</option>
                        <option value="video/">视频</option>
                        <option value="application/">文档/其他</option>
                    </select>
                    <button onclick="loadFiles(1)" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        检索
                    </button>
                </div>

                <!-- 网格/列表鍖?-->
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4" id="file-grid">
                    <div class="col-span-full text-center py-12 text-slate-500">正在加载文件...</div>
                </div>

    <!-- Scripts -->
    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let currentPage = 1;

        async function loadUsage() {
            try {
                // apiGet 返回的是 json.data，即 {totalSize, count}
                const res = await window.apiGet('/file/usage');
                if (res) {
                    const mb = (res.totalSize / 1024 / 1024).toFixed(2);
                    document.getElementById('file-usage-info').textContent = `共 ${res.count} 个文件，占用 ${mb} MB 空间。`;
                }
            } catch(e) {}
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadFiles(page = 1) {
            currentPage = page;
            const grid = document.getElementById('file-grid');
            const keyword = document.getElementById('filter-keyword').value;
            const mime = document.getElementById('filter-mime').value;

            try {
                // apiGet 返回的是 json.data，即 {list, total, limit} 分页对象
                const res = await window.apiGet('/file/index', { page, limit: 18, keyword, mime_type: mime });
                if (res) {
                    renderFiles(res.list);
                    renderPagination(res.total, res.limit, page);
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">加载失败</div>`;
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">请求异常</div>`;
            }
        }

        function renderFiles(list) {
            const grid = document.getElementById('file-grid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 rounded-xl border border-slate-200 bg-white shadow-sm">未找到相关文件</div>`;
                return;
            }

            grid.innerHTML = list.map(f => {
                const isImg = f.mime_type?.startsWith('image/');
                const uploader = f.member?.profile?.nickname || `Uploader ${f.member_id}`;
                const safeUrl = escapeHtml(f.url || '');
                const safeName = escapeHtml(f.name || f.original_name || '未命名文件');
                const safeUploader = escapeHtml(uploader);
                return `
                <div class="rounded-xl border border-slate-200 bg-white shadow-sm p-3 flex flex-col group relative">
                    <div class="aspect-square bg-slate-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center border border-slate-200 relative">
                        ${isImg
                            ? `<img src="${safeUrl}" class="w-full h-full object-cover transition-transform group-hover:scale-105">`
                            : `<svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`}

                        <div class="absolute inset-0 bg-slate-950/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                            <a href="${safeUrl}" target="_blank" class="p-2 bg-slate-100 hover:bg-white/20 rounded-full text-slate-950 backdrop-blur-md" title="查看"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></a>
                            <button onclick="deleteFile(${f.id})" class="p-2 bg-red-500/20 hover:bg-red-500/40 rounded-full text-red-400 backdrop-blur-md" title="删除"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                    <div class="text-sm font-medium truncate text-slate-700" title="${safeName}">${safeName}</div>
                    <div class="text-xs text-slate-500 mt-1 flex justify-between">
                        <span>${formatBytes(f.size)}</span>
                        <span class="truncate max-w-[60px]" title="${safeUploader}">${safeUploader}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderPagination(total, limit, current) {
            const wrap = document.getElementById('pagination');
            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                wrap.innerHTML = '';
                return;
            }

            let html = '';
            if (current > 1) html += `<button onclick="loadFiles(${current - 1})" class="px-3 py-1 bg-slate-50 border border-slate-200 rounded hover:bg-slate-100 text-sm">上一椤?/button>`;
            html += `<span class="px-3 py-1 text-sm text-slate-500">绗?${current} / ${totalPages} 椤?/span>`;
            if (current < totalPages) html += `<button onclick="loadFiles(${current + 1})" class="px-3 py-1 bg-slate-50 border border-slate-200 rounded hover:bg-slate-100 text-sm">下一椤?/button>`;

            wrap.innerHTML = html;
        }

        async function deleteFile(id) {
            if (!confirm('确定要永久删除该文件吗？若它正在被使用会导致引用失效。')) return;
            try {
                await window.apiPost('/file/delete', { id });
                loadUsage();
                loadFiles(currentPage);
            } catch (e) { alert(e.message || '操作失败'); }
        }

        async function uploadFiles() {
            const input = document.getElementById('file-upload-input');
            const files = Array.from(input.files || []);
            if (!files.length) return;
            try {
                for (const file of files) {
                    await window.apiUpload(file);
                }
                loadUsage();
                loadFiles(currentPage);
            } catch (err) {
                alert(err.message || '上传失败');
            } finally {
                input.value = '';
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUsage();
            loadFiles(1);
        });
    </script>
