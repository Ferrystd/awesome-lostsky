<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - 失落青空管理后台</title>
    <!-- CSS & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <!-- 侧边栏 -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">仪表盘</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">文件管理</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element flex flex-col h-full">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-1">团队文件库</h2>
                        <p class="text-sm text-gray-400" id="file-usage-info">总空间用量统计中...</p>
                    </div>
                </div>

                <!-- 筛选区 -->
                <div class="glass-panel p-4 rounded-xl mb-6 flex flex-wrap gap-4 items-center">
                    <input type="text" id="filter-keyword" placeholder="搜索文件名..." class="bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-primary placeholder-gray-600">
                    <select id="filter-mime" class="bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-primary">
                        <option value="">所有文件类型</option>
                        <option value="image/">图片</option>
                        <option value="video/">视频</option>
                        <option value="application/">文档/其他</option>
                    </select>
                    <button onclick="loadFiles(1)" class="bg-white/5 hover:bg-white/10 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-white/10">
                        检索
                    </button>
                </div>

                <!-- 网格/列表区 -->
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4" id="file-grid">
                    <div class="col-span-full text-center py-12 text-gray-500">正在加载文件...</div>
                </div>

                <!-- 分页 -->
                <div class="mt-6 flex justify-center gap-2" id="pagination">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let currentPage = 1;

        async function loadUsage() {
            try {
                // apiGet 返回的是 json.data，即 {totalSize, count}
                const res = await window.apiGet('/file/usage');
                if (res) {
                    const mb = (res.totalSize / 1024 / 1024).toFixed(2);
                    document.getElementById('file-usage-info').textContent = `共 ${res.count} 个文件，占用 ${mb} MB 空间。`;
                }
            } catch(e) {}
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadFiles(page = 1) {
            currentPage = page;
            const grid = document.getElementById('file-grid');
            const keyword = document.getElementById('filter-keyword').value;
            const mime = document.getElementById('filter-mime').value;
            
            try {
                // apiGet 返回的是 json.data，即 {list, total, limit} 分页对象
                const res = await window.apiGet('/file/index', { page, limit: 18, keyword, mime_type: mime });
                if (res) {
                    renderFiles(res.list);
                    renderPagination(res.total, res.limit, page);
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">加载失败</div>`;
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">请求异常</div>`;
            }
        }

        function renderFiles(list) {
            const grid = document.getElementById('file-grid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 glass-panel rounded-xl">未找到相关文件</div>`;
                return;
            }

            grid.innerHTML = list.map(f => {
                const isImg = f.mime_type?.startsWith('image/');
                const uploader = f.member?.profile?.nickname || `Uploader ${f.member_id}`;
                return `
                <div class="glass-card rounded-xl p-3 flex flex-col group relative">
                    <div class="aspect-square bg-black/40 rounded-lg mb-3 overflow-hidden flex items-center justify-center border border-white/5 relative">
                        ${isImg 
                            ? `<img src="${f.url}" class="w-full h-full object-cover transition-transform group-hover:scale-105">`
                            : `<svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`}
                        
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                            <a href="${f.url}" target="_blank" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white backdrop-blur-md" title="查看"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></a>
                            <button onclick="deleteFile(${f.id})" class="p-2 bg-red-500/20 hover:bg-red-500/40 rounded-full text-red-400 backdrop-blur-md" title="删除"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                    <div class="text-sm font-medium truncate text-gray-200" title="${f.original_name}">${f.original_name}</div>
                    <div class="text-xs text-gray-500 mt-1 flex justify-between">
                        <span>${formatBytes(f.size)}</span>
                        <span class="truncate max-w-[60px]" title="${uploader}">${uploader}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderPagination(total, limit, current) {
            const wrap = document.getElementById('pagination');
            const totalPages = Math.ceil(total / limit);
            if (totalPages <= 1) {
                wrap.innerHTML = '';
                return;
            }
            
            let html = '';
            if (current > 1) html += `<button onclick="loadFiles(${current - 1})" class="px-3 py-1 bg-white/5 border border-white/10 rounded hover:bg-white/10 text-sm">上一页</button>`;
            html += `<span class="px-3 py-1 text-sm text-gray-400">第 ${current} / ${totalPages} 页</span>`;
            if (current < totalPages) html += `<button onclick="loadFiles(${current + 1})" class="px-3 py-1 bg-white/5 border border-white/10 rounded hover:bg-white/10 text-sm">下一页</button>`;
            
            wrap.innerHTML = html;
        }

        async function deleteFile(id) {
            if (!confirm('确定要永久删除该文件吗？若它正在被使用会导致引用失效。')) return;
            try {
                await window.apiPost('/file/delete', { id });
                loadUsage();
                loadFiles(currentPage);
            } catch (e) { alert(e.message || '操作失败'); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUsage();
            loadFiles(1);
        });
    </script>
</body>
</html>
