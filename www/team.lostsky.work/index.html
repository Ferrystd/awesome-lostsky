<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队仪表盘 - 失落青空管理后台</title>
    <!-- CSS & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <!-- 全局背景 -->
    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>

    <!-- 移动端遮罩 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <!-- 侧边栏 -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="index.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    仪表盘
                </a>
                <a href="members.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    成员管理
                </a>
            </div>

            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="posts.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    岗位类型
                </a>
                <a href="fields.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    自定义字段
                </a>
                <a href="files.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    文件库
                </a>
                <a href="settings.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    团队设置
                </a>
            </div>
            
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="me.html" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1">
                    <svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    我的资料
                </a>
            </div>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- 顶部导航 -->
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-lg font-medium text-white">仪表盘</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative group">
                    <button class="flex items-center gap-3 p-1 pr-3 rounded-full hover:bg-white/5 transition-colors">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin&backgroundColor=0f172a" alt="User" class="w-8 h-8 rounded-full bg-slate-800 border border-white/10">
                        <span class="text-sm font-medium text-gray-300 hidden sm:block" id="header-user-name">Loading...</span>
                    </button>
                    <!-- 下拉菜单(预留) -->
                </div>
            </div>
        </header>

        <!-- 内容渲染区 -->
        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            
            <div class="fade-in-element">
                <!-- 欢迎区块 -->
                <div class="glass-panel p-8 rounded-3xl mb-8 relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-64 h-64 bg-primary/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                    <div class="relative z-10">
                        <h2 class="text-3xl font-bold mb-2">欢迎回来，<span class="text-gradient">运营总监</span></h2>
                        <p class="text-gray-400">今天是 <span id="current-date"></span>，团队运转一切正常。</p>
                        
                        <div class="mt-8 flex gap-4">
                            <a href="members.html" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                                管理成员
                            </a>
                            <a href="settings.html" class="glass-card hover:bg-white/5 px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                                调整团队设置
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 数据卡片网格 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
                        <div class="shimmer-sweep"></div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-gray-400 text-sm font-medium">团队总人数</h3>
                            <div class="p-2 bg-primary/20 rounded-lg text-primary">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold text-white mb-1" id="stat-members">-</div>
                        <p class="text-xs text-green-400">↑ 本月新增 5 人</p>
                    </div>

                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
                        <div class="shimmer-sweep"></div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-gray-400 text-sm font-medium">可用岗位类型</h3>
                            <div class="p-2 bg-secondary/20 rounded-lg text-secondary">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold text-white mb-1" id="stat-posts">-</div>
                        <p class="text-xs text-gray-500">已启用</p>
                    </div>

                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
                        <div class="shimmer-sweep"></div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-gray-400 text-sm font-medium">自定义字段数</h3>
                            <div class="p-2 bg-blue-500/20 rounded-lg text-blue-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold text-white mb-1" id="stat-fields">-</div>
                        <p class="text-xs text-gray-500">维护中</p>
                    </div>

                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden group">
                        <div class="shimmer-sweep"></div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-gray-400 text-sm font-medium">空间占用</h3>
                            <div class="p-2 bg-rose-500/20 rounded-lg text-rose-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                            </div>
                        </div>
                        <div class="text-3xl font-bold text-white mb-1" id="stat-space">- MB</div>
                        <p class="text-xs text-gray-500">共 <span id="stat-file-count">-</span> 个文件</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
            
            try {
                // 初始化获取个人信息 (apiGet 返回的是 json.data，即 member 对象)
                const meData = await window.apiGet('/me/get');
                if (meData) {
                    const profile = meData.profile || {};
                    const name = profile.nickname || `成员 ${meData.id}`;
                    document.getElementById('header-user-name').textContent = name;
                }

                // 获取仪表盘统计数据 (并行加载，apiGet 返回已解包数据)
                Promise.all([
                    window.apiGet('/member/index'),
                    window.apiGet('/postType/index'),
                    window.apiGet('/memberField/index'),
                    window.apiGet('/file/usage')
                ]).then(([memberList, postList, fieldList, fileUsage]) => {
                    if (memberList) {
                        document.getElementById('stat-members').textContent = memberList.length || 0;
                    }
                    if (postList) {
                        document.getElementById('stat-posts').textContent = postList.length || 0;
                    }
                    if (fieldList) {
                        document.getElementById('stat-fields').textContent = fieldList.length || 0;
                    }
                    if (fileUsage) {
                        const mb = (fileUsage.totalSize / 1024 / 1024).toFixed(2);
                        document.getElementById('stat-space').textContent = `${mb} MB`;
                        document.getElementById('stat-file-count').textContent = fileUsage.count || 0;
                    }
                }).catch(err => console.warn('仪表盘数据加载失败:', err));

            } catch (err) {
                console.error('API Error:', err);
            }
        });
    </script>
</body>
</html>
