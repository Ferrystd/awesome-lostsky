        <div class="flex-1 overflow-y-auto admin-scroll">

                <section class="fade-in-element mb-6">
                    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                        <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                            <div>
                                <h2 class="text-2xl font-semibold text-slate-950">数据概览</h2>
                                <p class="mt-1 text-sm text-slate-500" id="dashboard-status">正在加载团队数据...</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <a href="/members" class="inline-flex min-h-10 items-center rounded-lg bg-sky-600 px-4 text-sm font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors">成员管理</a>

                    </article>

                            </div>

                        </div>
                        <div id="latest-notices" class="divide-y divide-slate-100">
                            <div class="p-5 text-sm text-slate-500">正在加载站内信...</div>
                        </div>
                    </article>

                    <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                            <a href="/posts" class="rounded-lg border border-slate-200 px-4 py-3 text-sm text-slate-700 hover:bg-slate-50">岗位类型</a>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const setText = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            };
            const list = data => Array.isArray(data) ? data : (Array.isArray(data?.list) ? data.list : []);
            const listCount = data => list(data).length;
            const formatBytes = bytes => {
                const value = Number(bytes || 0);
                if (!value) return '0 MB';
                return `${(value / 1024 / 1024).toFixed(2)} MB`;
            };
            const formatTime = raw => {
                if (!raw) return '';
                const date = Number(raw) > 10000000000 ? new Date(Number(raw)) : new Date(Number(raw) * 1000);
                return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN');
            };
            const isRead = notice => Number(notice.is_read ?? notice.confirmed ?? notice.is_confirmed ?? 0) === 1;
            const escapeHtml = value => String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            setText('current-date', new Date().toLocaleDateString('zh-CN', {
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            }));

            if (!window.apiGet) return;

            try {
                const meData = await window.apiGet('/me/get');
                const profile = meData?.profile || {};
                setText('header-user-name', profile.nickname || meData?.name || (meData?.id ? `成员 ${meData.id}` : '当前成员'));
            } catch (err) {
                setText('header-user-name', '当前成员');
            }

            try {
                const [memberList, postList, fieldList, fileUsage, noticeData] = await Promise.all([
                    window.apiGet('/member/index'),
                    window.apiGet('/postType/index'),
                    window.apiGet('/memberField/index'),
                    window.apiGet('/file/usage'),
                    window.apiGet('/notice/index')
                ]);

                setText('stat-members', listCount(memberList));
                setText('stat-posts', listCount(postList));
                setText('stat-fields', listCount(fieldList));
                setText('stat-file-count', fileUsage?.count ?? fileUsage?.file_count ?? 0);
                setText('stat-space', formatBytes(fileUsage?.totalSize ?? fileUsage?.total_size ?? 0));

                const notices = list(noticeData);
                const unread = notices.filter(notice => !isRead(notice)).length;
                setText('notice-summary', `共 ${notices.length} 封，${unread} 封未确认`);

                const latestWrap = document.getElementById('latest-notices');
                if (!notices.length) {
                    latestWrap.innerHTML = '<div class="p-5 text-sm text-slate-500">暂无站内信</div>';
                } else {
                    latestWrap.innerHTML = notices.slice(0, 5).map(notice => `
                        <a href="/notice" class="block p-5 hover:bg-slate-50">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="font-medium text-slate-950 truncate">${escapeHtml(notice.title || '未命名站内信')}</p>
                                    <p class="mt-1 text-xs text-slate-500">${escapeHtml(formatTime(notice.create_time || notice.update_time))}</p>
                                </div>
                                <span class="shrink-0 rounded-full px-2 py-1 text-xs ${isRead(notice) ? 'bg-slate-100 text-slate-500' : 'bg-sky-50 text-sky-700'}">${isRead(notice) ? '已确认' : '未确认'}</span>
                            </div>
                        </a>
                    `).join('');
                }

                setText('dashboard-status', '数据已同步');
            } catch (err) {
                setText('dashboard-status', '数据加载失败');
                setText('notice-summary', '站内信加载失败');
                document.getElementById('latest-notices').innerHTML = '<div class="p-5 text-sm text-red-600">站内信加载失败</div>';
            }
        });
    </script>
