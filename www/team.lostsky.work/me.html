<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资料 - 失落青空管理后台</title>
    <!-- CSS & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">个人中心</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">我的资料</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element max-w-3xl mx-auto">
                
                <div class="glass-panel rounded-3xl p-8 border border-white/5 relative overflow-hidden">
                    <div class="absolute left-0 top-0 w-64 h-64 bg-primary/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
                    
                    <div class="relative z-10 flex flex-col md:flex-row items-center md:items-start gap-8 mb-8 pb-8 border-b border-white/5">
                        <div class="relative group">
                            <img id="display-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Me&backgroundColor=0f172a" class="w-32 h-32 rounded-full bg-slate-800 object-cover border-4 border-black shadow-lg">
                            <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                                <span class="text-xs font-medium text-white">更换头像</span>
                            </div>
                        </div>
                        <div class="flex-1 text-center md:text-left">
                            <h2 class="text-3xl font-bold text-white mb-2" id="display-name">加载中...</h2>
                            <p class="text-gray-400 mb-4" id="display-desc">——</p>
                            <div class="flex flex-wrap gap-2 justify-center md:justify-start" id="display-posts">
                                <!-- 岗位徽章 -->
                            </div>
                        </div>
                    </div>

                    <form id="me-form" class="space-y-6 relative z-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">昵称 (Nickname)</label>
                                <input type="text" id="form-nickname" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">头像链接 (Avatar URL)</label>
                                <input type="text" id="form-avatar" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">一句话描述 (Description)</label>
                            <input type="text" id="form-description" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">介绍图 (Intro Image)</label>
                                <input type="text" id="form-intro_image" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">介绍视频 (Intro Video)</label>
                                <input type="text" id="form-intro_video" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">详细介绍 (Markdown)</label>
                            <textarea id="form-intro_md" rows="5" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600 admin-scroll" placeholder="支持 Markdown 语法的图文介绍..."></textarea>
                        </div>

                        <div id="form-message" class="hidden p-3 rounded-lg text-sm"></div>

                        <div class="pt-6 border-t border-white/5 flex justify-end">
                            <button type="submit" class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-primary/20 tech-border-glow">
                                保存修改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        async function loadMe() {
            try {
                // apiGet 返回的是 json.data，即 member 对象
                const member = await window.apiGet('/me/get');
                if (member) {
                    const p = member.profile || {};
                    
                    // Display
                    document.getElementById('display-name').textContent = p.nickname || '未设置昵称';
                    document.getElementById('display-desc').textContent = p.description || '这家伙很懒，什么都没写...';
                    if (p.avatar) document.getElementById('display-avatar').src = p.avatar;
                    
                    const posts = member.posts || [];
                    const postsHtml = posts.map(post => `<span class="px-3 py-1 bg-white/10 border border-white/10 rounded-full text-xs text-gray-300">${post.type?.name || '未知岗位'}</span>`).join('');
                    document.getElementById('display-posts').innerHTML = postsHtml || '<span class="text-gray-500 text-sm">暂无分配岗位</span>';

                    // Form
                    document.getElementById('form-nickname').value = p.nickname || '';
                    document.getElementById('form-avatar').value = p.avatar || '';
                    document.getElementById('form-description').value = p.description || '';
                    document.getElementById('form-intro_image').value = p.intro_image || '';
                    document.getElementById('form-intro_video').value = p.intro_video || '';
                    document.getElementById('form-intro_md').value = p.introduction_markdown || '';
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('me-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('form-message');
            msgEl.className = 'hidden p-3 rounded-lg text-sm';

            const payload = {
                nickname: document.getElementById('form-nickname').value,
                avatar: document.getElementById('form-avatar').value,
                description: document.getElementById('form-description').value,
                intro_image: document.getElementById('form-intro_image').value,
                intro_video: document.getElementById('form-intro_video').value,
                introduction_markdown: document.getElementById('form-intro_md').value,
            };

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost('/me/edit', payload);
                msgEl.textContent = '资料更新成功';
                msgEl.classList.add('bg-green-500/10', 'border', 'border-green-500/20', 'text-green-400');
                msgEl.classList.remove('hidden');
                loadMe();
                setTimeout(() => msgEl.classList.add('hidden'), 3000);
            } catch (err) {
                msgEl.textContent = err.message || '网络异常';
                msgEl.classList.add('bg-red-500/10', 'border', 'border-red-500/20', 'text-red-400');
                msgEl.classList.remove('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', loadMe);
    </script>
</body>
</html>
