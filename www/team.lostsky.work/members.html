<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员管理 - 失落青空管理后台</title>
    <!-- CSS & Tailwind -->
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <!-- 全局背景 -->
    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <!-- 侧边栏 (复用结构, 在实际项目中可以通过模板引擎引入, 静态页面先硬编码) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- 顶部导航 -->
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">仪表盘</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">成员管理</span>
                </div>
            </div>
        </header>

        <!-- 内容渲染区 -->
        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element flex flex-col h-full">
                
                <!-- 头部操作区 -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-1">团队成员</h2>
                        <p class="text-sm text-gray-400">管理团队内所有成员的状态、资料与岗位。</p>
                    </div>
                    <button onclick="openMemberModal()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors tech-border-glow shadow-[0_0_15px_rgba(14,165,233,0.3)]">
                        + 添加成员
                    </button>
                </div>

                <!-- 表格区域 -->
                <div class="glass-panel rounded-2xl overflow-hidden flex-1 flex flex-col border border-white/5">
                    <div class="overflow-x-auto">
                        <table class="admin-table min-w-[800px]">
                            <thead>
                                <tr>
                                    <th class="w-16">ID</th>
                                    <th>成员信息</th>
                                    <th>岗位</th>
                                    <th>展示状态</th>
                                    <th>账号状态</th>
                                    <th class="text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="member-table-body">
                                <tr><td colspan="6" class="text-center py-8 text-gray-500">正在加载数据...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- 成员表单弹窗 -->
    <div id="member-modal" class="modal-overlay glass-overlay">
        <div class="modal-content w-full max-w-lg glass-panel rounded-2xl border border-white/10 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b border-white/5">
                <h3 class="text-xl font-bold" id="modal-title">添加成员</h3>
                <button onclick="closeModal('member-modal')" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto admin-scroll flex-1">
                <form id="member-form" class="space-y-5">
                    <input type="hidden" id="form-member-id">
                    
                    <div id="user-id-group">
                        <label class="block text-sm font-medium text-gray-300 mb-1">系统 User ID <span class="text-red-400">*</span></label>
                        <input type="number" id="form-user-id" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600" placeholder="填写要邀请的用户ID">
                        <p class="text-xs text-gray-500 mt-1">仅添加新成员时需要。</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">昵称 (Nickname)</label>
                        <input type="text" id="form-nickname" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">头像 (Avatar)</label>
                        <input type="hidden" id="form-avatar">
                        <input type="file" id="upload-avatar" class="hidden" accept="image/*" onchange="uploadMemberFile('upload-avatar', 'form-avatar')">
                        <div class="page-team-upload-capsule" onclick="document.getElementById('upload-avatar').click()" onkeydown="triggerUploadOnKey(event, 'upload-avatar')" role="button" tabindex="0" aria-label="上传头像">
                            <div class="page-team-upload-icon">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 4v12m0-12l-4 4m4-4l4 4"></path></svg>
                            </div>
                            <div class="page-team-upload-info">
                                <div class="page-team-upload-title">点击上传头像</div>
                                <span id="form-avatar-status" class="page-team-upload-status">未上传</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">一句话描述 (Description)</label>
                        <input type="text" id="form-description" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">介绍图 (Intro Image)</label>
                            <input type="hidden" id="form-intro_image">
                            <input type="file" id="upload-intro_image" class="hidden" accept="image/*" onchange="uploadMemberFile('upload-intro_image', 'form-intro_image')">
                            <div class="page-team-upload-capsule" onclick="document.getElementById('upload-intro_image').click()" onkeydown="triggerUploadOnKey(event, 'upload-intro_image')" role="button" tabindex="0" aria-label="上传介绍图">
                                <div class="page-team-upload-icon">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 4v12m0-12l-4 4m4-4l4 4"></path></svg>
                                </div>
                                <div class="page-team-upload-info">
                                    <div class="page-team-upload-title">上传图片文件</div>
                                    <span id="form-intro_image-status" class="page-team-upload-status">未上传</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">介绍视频 (Intro Video)</label>
                            <input type="hidden" id="form-intro_video">
                            <input type="file" id="upload-intro_video" class="hidden" accept="video/*" onchange="uploadMemberFile('upload-intro_video', 'form-intro_video')">
                            <div class="page-team-upload-capsule" onclick="document.getElementById('upload-intro_video').click()" onkeydown="triggerUploadOnKey(event, 'upload-intro_video')" role="button" tabindex="0" aria-label="上传介绍视频">
                                <div class="page-team-upload-icon">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 4v12m0-12l-4 4m4-4l4 4"></path></svg>
                                </div>
                                <div class="page-team-upload-info">
                                    <div class="page-team-upload-title">上传视频文件</div>
                                    <span id="form-intro_video-status" class="page-team-upload-status">未上传</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">详细介绍 (Markdown)</label>
                        <textarea id="form-intro_md" rows="4" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600 admin-scroll"></textarea>
                    </div>

                    <div class="pt-2 border-t border-white/5">
                        <label class="block text-sm font-medium text-gray-300 mb-3">分配岗位</label>
                        <div id="form-posts-container" class="flex flex-wrap gap-4">
                            <span class="text-xs text-gray-500">正在加载岗位...</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pt-2 border-t border-white/5">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="form-is-displayed" class="sr-only peer" checked>
                            <div class="page-team-switch"></div>
                            <span class="ml-3 text-sm font-medium text-gray-300">在前台展示 (is_displayed)</span>
                        </label>
                    </div>
                    
                    <div id="form-error" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                </form>
            </div>
            
            <div class="p-6 border-t border-white/5 flex justify-end gap-3 bg-black/20">
                <button type="button" onclick="closeModal('member-modal')" class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-colors">取消</button>
                <button type="button" onclick="submitMemberForm()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-primary/20">
                    保存成员
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let allMembers = [];
        let allPostTypes = [];

        async function loadMembers() {
            const tbody = document.getElementById('member-table-body');
            try {
                // 并行加载成员和岗位列表
                const [membersRes, postsRes] = await Promise.all([
                    window.apiGet('/member/index'),
                    window.apiGet('/postType/index')
                ]);
                
                allMembers = membersRes || [];
                allPostTypes = postsRes || [];
                
                renderTable(allMembers);
                renderPostCheckboxes(allPostTypes);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-400">网络请求失败</td></tr>`;
            }
        }

        function renderPostCheckboxes(posts) {
            const container = document.getElementById('form-posts-container');
            if (!posts.length) {
                container.innerHTML = '<span class="text-xs text-gray-500">暂无可用岗位，请先去「岗位类型」添加</span>';
                return;
            }
            container.innerHTML = posts.map(p => `
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" name="post_ids" value="${p.id}" class="w-4 h-4 rounded bg-black/30 border-white/10 text-primary focus:ring-primary focus:ring-offset-slate-900">
                    <span class="ml-2 text-sm text-gray-300">${p.name}</span>
                </label>
            `).join('');
        }

        function renderTable(data) {
            const tbody = document.getElementById('member-table-body');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">暂无成员数据</td></tr>`;
                return;
            }
            
            tbody.innerHTML = data.map(m => {
                const profile = m.profile || {};
                const nickname = profile.nickname || `用户 ${m.user_id}`;
                const avatar = profile.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${m.user_id}&backgroundColor=0f172a`;
                const posts = (m.posts || []).map(p => p.type?.name || '未知岗位').join(', ');
                
                return `
                <tr>
                    <td class="text-gray-400 font-mono">#${m.id}</td>
                    <td>
                        <div class="flex items-center gap-3">
                            <img src="${avatar}" alt="avatar" class="w-10 h-10 rounded-full bg-slate-800 object-cover">
                            <div>
                                <div class="font-medium text-white">${nickname}</div>
                                <div class="text-xs text-gray-500">User ID: ${m.user_id}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="inline-block px-2 py-1 rounded bg-white/5 text-xs text-gray-300 border border-white/10">${posts || '暂无岗位'}</span></td>
                    <td>
                        ${m.is_displayed 
                            ? `<span class="text-green-400 text-xs flex items-center"><span class="w-2 h-2 rounded-full bg-green-400 mr-2"></span>展示中</span>` 
                            : `<span class="text-gray-500 text-xs flex items-center"><span class="w-2 h-2 rounded-full bg-gray-500 mr-2"></span>已隐藏</span>`}
                    </td>
                    <td>
                        ${m.is_blocked 
                            ? `<span class="text-red-400 text-xs font-medium">已封禁</span>` 
                            : `<span class="text-blue-400 text-xs font-medium">正常</span>`}
                    </td>
                    <td>
                        <div class="flex items-center justify-start gap-3">
                            <a href="/member-detail?id=${m.id}" class="text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors">详情</a>
                            <button onclick="editMember(${m.id})" class="text-primary hover:text-primary/80 text-sm font-medium transition-colors">编辑</button>
                            ${m.is_blocked 
                                ? `<button onclick="toggleBlock(${m.id}, false)" class="text-green-400 hover:text-green-300 text-sm font-medium transition-colors">解封</button>`
                                : `<button onclick="toggleBlock(${m.id}, true)" class="text-orange-400 hover:text-orange-300 text-sm font-medium transition-colors">封禁</button>`}
                            <button onclick="removeMember(${m.id})" class="text-red-400 hover:text-red-300 text-sm font-medium transition-colors">移出</button>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function openMemberModal(member = null) {
            const isEdit = !!member;
            document.getElementById('modal-title').textContent = isEdit ? '编辑成员' : '添加成员';
            document.getElementById('user-id-group').style.display = isEdit ? 'none' : 'block';
            
            document.getElementById('form-member-id').value = isEdit ? member.id : '';
            document.getElementById('form-user-id').value = isEdit ? member.user_id : '';
            
            const p = member?.profile || {};
            document.getElementById('form-nickname').value = p.nickname || '';
            document.getElementById('form-avatar').value = p.avatar || '';
            document.getElementById('form-description').value = p.description || '';
            document.getElementById('form-intro_image').value = p.intro_image || '';
            document.getElementById('form-intro_video').value = p.intro_video || '';
            document.getElementById('form-intro_md').value = p.introduction_markdown || '';
            document.getElementById('form-is-displayed').checked = isEdit ? member.is_displayed : true;
            updateUploadStatus('form-avatar', p.avatar || '');
            updateUploadStatus('form-intro_image', p.intro_image || '');
            updateUploadStatus('form-intro_video', p.intro_video || '');

            // 回显岗位复选框
            const postIds = member ? (member.posts || []).map(p => p.post_id) : [];
            document.querySelectorAll('input[name="post_ids"]').forEach(cb => {
                cb.checked = postIds.includes(parseInt(cb.value));
            });
            
            document.getElementById('form-error').classList.add('hidden');
            window.openModal('member-modal');
        }

        function editMember(id) {
            const member = allMembers.find(m => m.id === id);
            if (member) openMemberModal(member);
        }

        async function uploadMemberFile(fileInputId, targetInputId) {
            const fileInput = document.getElementById(fileInputId);
            const targetInput = document.getElementById(targetInputId);
            const file = fileInput?.files?.[0];
            if (!file) return;
            try {
                const result = await window.apiUpload(file);
                targetInput.value = result.url || '';
                updateUploadStatus(targetInputId, result.url || '', file.name);
            } catch (err) {
                alert(err.message || '上传失败');
            } finally {
                if (fileInput) fileInput.value = '';
            }
        }

        function updateUploadStatus(targetInputId, url, fileName = '') {
            const statusEl = document.getElementById(`${targetInputId}-status`);
            if (!statusEl) return;
            statusEl.textContent = url ? (fileName || '已上传') : '未上传';
            statusEl.classList.toggle('is-ready', !!url);
        }

        function triggerUploadOnKey(event, inputId) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            document.getElementById(inputId)?.click();
        }

        async function submitMemberForm() {
            const id = document.getElementById('form-member-id').value;
            const isEdit = !!id;
            const errorEl = document.getElementById('form-error');
            
            // 收集选中的岗位 IDs
            const selectedPostIds = Array.from(document.querySelectorAll('input[name="post_ids"]:checked')).map(cb => parseInt(cb.value));

            const payload = {
                nickname: document.getElementById('form-nickname').value,
                avatar: document.getElementById('form-avatar').value,
                description: document.getElementById('form-description').value,
                intro_image: document.getElementById('form-intro_image').value,
                intro_video: document.getElementById('form-intro_video').value,
                introduction_markdown: document.getElementById('form-intro_md').value,
                post_type_ids: selectedPostIds
            };

            let endpoint = '';
            if (isEdit) {
                endpoint = '/member/edit';
                payload.member_id = parseInt(id);
                payload.is_displayed = document.getElementById('form-is-displayed').checked;
            } else {
                endpoint = '/member/add';
                payload.user_id = parseInt(document.getElementById('form-user-id').value);
                if (!payload.user_id) {
                    errorEl.textContent = '系统 User ID 不能为空';
                    errorEl.classList.remove('hidden');
                    return;
                }
            }

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost(endpoint, payload);
                window.closeModal('member-modal');
                loadMembers();
            } catch (err) {
                errorEl.textContent = err.message || '操作失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function toggleBlock(id, toBlock) {
            if (!confirm(`确定要${toBlock ? '封禁' : '解封'}该成员吗？`)) return;
            const endpoint = toBlock ? '/member/block' : '/member/unblock';
            try {
                // apiPost 成功时返回数据，失败时抛 Error
                await window.apiPost(endpoint, { member_id: id });
                loadMembers();
            } catch (err) {
                alert(err.message || '操作失败');
            }
        }

        async function removeMember(id) {
            if (!confirm('严重警告：确定要将该成员移出团队吗？此操作不可逆！')) return;
            try {
                await window.apiPost('/member/remove', { member_id: id });
                loadMembers();
            } catch (err) {
                alert(err.message || '操作失败');
            }
        }

        document.addEventListener('DOMContentLoaded', loadMembers);
    </script>
</body>
</html>
