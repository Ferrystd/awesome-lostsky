<body class="antialiased selection:bg-sky-100 selection:text-sky-900 bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 flex-shrink-0">
            <a href="/" class="flex items-center gap-3" aria-label="团队控制台">

                </span>
                <span>

                    <span class="block text-xs text-slate-500">团队后台</span>

        </div>

        <nav class="flex-1 overflow-y-auto py-4 admin-scroll" aria-label="团队后台导航">
            <div class="px-3 mb-6">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-9h-6v9zm0-13h6V4h-6v3z"></path></svg>
                    仪表盘
                </a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11a4 4 0 10-8 0m8 0a4 4 0 01-8 0M4 20a8 8 0 0116 0"></path></svg>
                    成员管理
                </a>
                <a href="/join-review" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11a4 4 0 10-8 0m8 0a4 4 0 01-8 0M5 20a7 7 0 0114 0"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M18 8l2 2 3-4"></path></svg>
                    加入审核
                </a>
                <a href="/notice" class="sidebar-link active flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 8.5v7A2.5 2.5 0 0118.5 18h-13A2.5 2.5 0 013 15.5v-7A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 8l8 5 8-5"></path></svg>
                    站内信
                </a>
            </div>

            <div class="px-3 mb-6">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 7.5v9A2.5 2.5 0 0117.5 19h-11A2.5 2.5 0 014 16.5v-9A2.5 2.5 0 016.5 5H9l1.4 2h7.1A2.5 2.5 0 0120 7.5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 13h8"></path></svg>
                    岗位类型
                </a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 5h8M8 12h8M8 19h8"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.5 5h.01M4.5 12h.01M4.5 19h.01"></path></svg>
                    自定义字段
                </a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.5 7.5A2.5 2.5 0 016 5h4l2 2h6A2.5 2.5 0 0120.5 9.5v7A2.5 2.5 0 0118 19H6a2.5 2.5 0 01-2.5-2.5v-9z"></path></svg>
                    文件库
                </a>
                <a href="/docs" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 4h7l4 4v12H7a2 2 0 01-2-2V6a2 2 0 012-2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14 4v5h5M9 13h6M9 17h6"></path></svg>
                    文档库
                </a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19.4 15a1.8 1.8 0 00.36 1.98l.05.05a2.1 2.1 0 01-2.97 2.97l-.05-.05a1.8 1.8 0 00-1.98-.36 1.8 1.8 0 00-1.1 1.66V21a2.1 2.1 0 01-4.2 0v-.08A1.8 1.8 0 008.4 19.3a1.8 1.8 0 00-1.98.36l-.05.05A2.1 2.1 0 013.4 16.74l.05-.05a1.8 1.8 0 00.36-1.98 1.8 1.8 0 00-1.66-1.1H2a2.1 2.1 0 010-4.2h.08A1.8 1.8 0 003.7 8.3a1.8 1.8 0 00-.36-1.98l-.05-.05A2.1 2.1 0 016.26 3.3l.05.05a1.8 1.8 0 001.98.36h.01A1.8 1.8 0 009.4 2.08V2a2.1 2.1 0 014.2 0v.08a1.8 1.8 0 001.1 1.66 1.8 1.8 0 001.98-.36l.05-.05A2.1 2.1 0 0119.7 6.3l-.05.05a1.8 1.8 0 00-.36 1.98 1.8 1.8 0 001.66 1.1H21a2.1 2.1 0 010 4.2h-.08A1.8 1.8 0 0019.4 15z"></path></svg>
                    团队设置
                </a>
            </div>

            <div class="px-3">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 12a4 4 0 100-8 4 4 0 000 8z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 20a8 8 0 0116 0"></path></svg>
                    我的资料
                </a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-slate-200 bg-white z-10 flex-shrink-0">
            <div class="flex items-center min-w-0">
                <button id="mobile-menu-btn" class="md:hidden inline-flex h-11 w-11 items-center justify-center -ml-2 mr-2 text-slate-500 rounded-lg hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" aria-label="打开菜单">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm truncate">
                    <a href="/" class="text-slate-500 hover:text-slate-700 transition-colors">仪表盘</a>
                    <span class="mx-2 text-slate-300">/</span>
                    <span class="text-slate-950 font-medium">站内信</span>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2">
                <button id="confirm-all-btn" class="inline-flex min-h-10 items-center gap-2 rounded-lg bg-sky-600 px-4 text-sm font-medium text-white hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors">全部确认</button>
                <button id="receive-all-btn" disabled class="inline-flex min-h-10 items-center gap-2 rounded-lg border border-slate-200 bg-slate-100 px-4 text-sm font-medium text-slate-400 cursor-not-allowed" title="资产收取接口暂不实现">全部确认并收取</button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element">
                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-end gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-semibold text-slate-950 mb-1">站内信</h1>
                        <p class="text-sm text-slate-500" id="notice-summary">正在加载站内信...</p>
                    </div>
                    <div class="rounded-xl border border-slate-200 bg-white p-1 flex flex-wrap gap-1">
                        <button class="notice-filter px-3 py-2 rounded-lg text-sm bg-sky-50 text-sky-700" data-filter="all">全部</button>
                        <button class="notice-filter px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50" data-filter="unread">未确认</button>
                        <button class="notice-filter px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50" data-filter="read">已确认</button>
                        <button class="notice-filter px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50" data-filter="asset">含资产</button>
                    </div>
                </div>

                <section class="grid grid-cols-1 xl:grid-cols-[minmax(0,420px)_minmax(0,1fr)] gap-6">
                    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 flex gap-3">
                            <label class="sr-only" for="notice-keyword">搜索站内信</label>
                            <input id="notice-keyword" type="search" placeholder="搜索标题或内容..." class="flex-1 min-w-0 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 placeholder-slate-400">
                            <button id="notice-search-btn" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors">搜索</button>
                        </div>
                        <div id="notice-list" class="divide-y divide-slate-100 max-h-[calc(100vh-260px)] min-h-[360px] overflow-y-auto admin-scroll">
                            <div class="p-8 text-center text-slate-500">正在加载站内信...</div>
                        </div>
                    </div>

                    <article class="rounded-2xl border border-slate-200 bg-white shadow-sm min-h-[520px] overflow-hidden">
                        <div id="notice-detail-empty" class="h-full min-h-[520px] flex flex-col items-center justify-center text-center p-8 text-slate-500">
                            <svg class="w-12 h-12 mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 8.5v7A2.5 2.5 0 0118.5 18h-13A2.5 2.5 0 013 15.5v-7A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8l8 5 8-5"></path></svg>
                            <p class="text-sm">选择一封站内信查看详情</p>
                        </div>

                        <div id="notice-detail" class="hidden h-full flex-col">
                            <div class="p-6 border-b border-slate-200">
                                <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
                                    <div class="min-w-0">
                                        <div class="flex flex-wrap items-center gap-2 mb-3" id="notice-detail-badges"></div>
                                        <h2 class="text-2xl font-semibold text-slate-950 break-words" id="notice-detail-title"></h2>
                                        <p class="text-sm text-slate-500 mt-2" id="notice-detail-time"></p>
                                    </div>
                                    <div class="flex flex-wrap gap-2 shrink-0">
                                        <button id="confirm-btn" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors">确认</button>
                                        <button id="receive-btn" disabled class="rounded-lg border border-slate-200 bg-slate-100 px-4 py-2 text-sm font-medium text-slate-400 cursor-not-allowed" title="资产收取接口暂不实现">确认并收取</button>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6 overflow-y-auto admin-scroll">
                                <div id="notice-detail-content" class="max-w-none text-slate-700 leading-7 whitespace-pre-wrap"></div>
                                <div id="notice-asset-box" class="hidden mt-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4">
                                    <p class="text-sm font-medium text-emerald-900 mb-1">关联资产</p>
                                    <p class="text-sm text-emerald-700">该站内信包含可收取资产。当前页面仅展示入口，收取逻辑暂不实现。</p>
                                </div>
                            </div>
                        </div>
                    </article>
                </section>
            </div>
        </div>
    </main>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script src="//assets.lostsky.work/js/page-notice.js"></script>
</body>
</html>
