            <div class="px-3">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-slate-700 mb-1">
                    <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 12a4 4 0 100-8 4 4 0 000 8z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 20a8 8 0 0116 0"></path></svg>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-slate-200 bg-white z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden inline-flex h-11 w-11 items-center justify-center -ml-2 mr-2 text-slate-500 rounded-lg hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-slate-500 hover:text-slate-700 transition-colors">仪表盘</a>
                    <span class="mx-2 text-slate-300">/</span>
                    <span class="text-slate-950 font-medium">岗位类型</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element flex flex-col h-full">

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-semibold mb-1">岗位管理</h2>
                        <p class="text-sm text-slate-500">定义团队内可分配的成员岗位（如店长、派单、打手等）。</p>
                    </div>
                    <button onclick="openPostModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
                        + 新增岗位
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="post-grid">
                    <div class="col-span-full text-center py-12 text-slate-500">正在加载数据...</div>
                </div>

            </div>
        </div>

    <!-- 弹窗 -->
    <div id="post-modal" class="modal-overlay bg-slate-950/50 backdrop-blur-sm">
        <div class="modal-content w-full max-w-md rounded-2xl border border-slate-200 bg-white shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-6 border-b border-slate-200">
                <h3 class="text-xl font-semibold" id="modal-title">新增岗位</h3>
                <button onclick="closeModal('post-modal')" class="text-slate-500 hover:text-slate-950 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-6">
                <form id="post-form" class="space-y-4">
                    <input type="hidden" id="form-id">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">岗位名称 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-name" required class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400" placeholder="例如：财务">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">岗位描述</label>
                        <input type="text" id="form-desc" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">排序鍊?/label>
                        <input type="number" id="form-sort" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400" value="0">
                        <p class="text-xs text-slate-500 mt-1">越小越靠鍓?/p>
                    </div>
                    <div id="form-error" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                </form>
            </div>

            <div class="p-6 border-t border-slate-200 flex justify-end gap-3 bg-slate-50">
                <button type="button" onclick="closeModal('post-modal')" class="px-5 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-950 hover:bg-slate-50 transition-colors">取消</button>
                <button type="button" onclick="submitPostForm()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let allPosts = [];

        async function loadPosts() {
            const grid = document.getElementById('post-grid');
            try {
                // apiGet 返回的是 json.data，即岗位数组
                const res = await window.apiGet('/postType/index');
                allPosts = res || [];
                renderPosts(allPosts);
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">网络异常</div>`;
            }
        }

        function renderPosts(data) {
            const grid = document.getElementById('post-grid');
            if (!data.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 rounded-xl border border-slate-200 bg-white shadow-sm">暂无岗位类型，请先新增</div>`;
                return;
            }

            grid.innerHTML = data.map(p => `
                <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-6 relative group overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-sky-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-sky-50 text-sky-700 flex items-center justify-center">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </div>
                                <h3 class="text-lg font-semibold text-slate-950">${p.name}</h3>
                            </div>
                            <span class="text-xs text-slate-500 font-mono bg-slate-50 border border-slate-200 px-2 py-1 rounded">Sort: ${p.sort}</span>
                        </div>
                        <p class="text-sm text-slate-500 mb-6 h-10 overflow-hidden line-clamp-2">${p.description || '暂无描述'}</p>

                        <div class="flex justify-end gap-2 pt-4 border-t border-slate-200 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editPost(${p.id})" class="p-2 text-sky-700 hover:bg-sky-50 rounded-md transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            <button onclick="deletePost(${p.id})" class="p-2 text-red-400 hover:bg-red-500/20 rounded-md transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPostModal(post = null) {
            const isEdit = !!post;
            document.getElementById('modal-title').textContent = isEdit ? '编辑岗位' : '新增岗位';
            document.getElementById('form-id').value = isEdit ? post.id : '';
            document.getElementById('form-name').value = isEdit ? post.name : '';
            document.getElementById('form-desc').value = isEdit ? (post.description || '') : '';
            document.getElementById('form-sort').value = isEdit ? post.sort : '0';

            document.getElementById('form-error').classList.add('hidden');
            window.openModal('post-modal');
        }

        function editPost(id) {
            const post = allPosts.find(p => p.id === id);
            if (post) openPostModal(post);
        }

        async function submitPostForm() {
            const id = document.getElementById('form-id').value;
            const errorEl = document.getElementById('form-error');

            const payload = {
                name: document.getElementById('form-name').value,
                description: document.getElementById('form-desc').value,
                sort: parseInt(document.getElementById('form-sort').value) || 0
            };

            if (!payload.name) {
                errorEl.textContent = '名称为必填项';
                errorEl.classList.remove('hidden');
                return;
            }

            const endpoint = id ? '/postType/edit' : '/postType/add';
            if (id) payload.id = parseInt(id);

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost(endpoint, payload);
                window.closeModal('post-modal');
                loadPosts();
            } catch (err) {
                errorEl.textContent = err.message || '操作失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function deletePost(id) {
            if (!confirm('确定删除该岗位？')) return;
            try {
                await window.apiPost('/postType/delete', { id });
                loadPosts();
            } catch (e) { alert(e.message || '操作失败'); }
        }

        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
