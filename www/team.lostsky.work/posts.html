<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岗位管理 - 失落青空管理后台</title>
    <!-- CSS & Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//assets.lostsky.work/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="//assets.lostsky.work/css/base.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/components.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/animations.css">
    <link rel="stylesheet" href="//assets.lostsky.work/css/page-team.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-[#020617] to-[#020617]"></div>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 md:hidden glass-overlay"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 glass-panel border-r border-white/5 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col md:relative">
        <div class="h-16 flex items-center px-6 border-b border-white/5 flex-shrink-0">
            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">仪表盘</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">岗位类型</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element flex flex-col h-full">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-1">岗位管理</h2>
                        <p class="text-sm text-gray-400">定义团队内可分配的成员岗位 (如: 店长、派单、打手等)。</p>
                    </div>
                    <button onclick="openPostModal()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors tech-border-glow shadow-[0_0_15px_rgba(14,165,233,0.3)]">
                        + 新增岗位
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="post-grid">
                    <div class="col-span-full text-center py-12 text-gray-500">正在加载数据...</div>
                </div>

            </div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div id="post-modal" class="modal-overlay glass-overlay">
        <div class="modal-content w-full max-w-md glass-panel rounded-2xl border border-white/10 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-6 border-b border-white/5">
                <h3 class="text-xl font-bold" id="modal-title">新增岗位</h3>
                <button onclick="closeModal('post-modal')" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6">
                <form id="post-form" class="space-y-4">
                    <input type="hidden" id="form-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">岗位名称 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-name" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600" placeholder="例如: 财务">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">岗位描述</label>
                        <input type="text" id="form-desc" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">排序值</label>
                        <input type="number" id="form-sort" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600" value="0">
                        <p class="text-xs text-gray-500 mt-1">越小越靠前</p>
                    </div>
                    <div id="form-error" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>
                </form>
            </div>
            
            <div class="p-6 border-t border-white/5 flex justify-end gap-3 bg-black/20">
                <button type="button" onclick="closeModal('post-modal')" class="px-5 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-white/5 transition-colors">取消</button>
                <button type="button" onclick="submitPostForm()" class="bg-primary hover:bg-primary/90 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        let allPosts = [];

        async function loadPosts() {
            const grid = document.getElementById('post-grid');
            try {
                // apiGet 返回的是 json.data，即岗位数组
                const res = await window.apiGet('/postType/index');
                allPosts = res || [];
                renderPosts(allPosts);
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">网络异常</div>`;
            }
        }

        function renderPosts(data) {
            const grid = document.getElementById('post-grid');
            if (!data.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 glass-panel rounded-xl">暂无岗位类型，请先新增</div>`;
                return;
            }
            
            grid.innerHTML = data.map(p => `
                <div class="glass-card rounded-2xl p-6 relative group overflow-hidden border border-white/5">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-primary/20 text-primary flex items-center justify-center">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </div>
                                <h3 class="text-lg font-bold text-white">${p.name}</h3>
                            </div>
                            <span class="text-xs text-gray-500 font-mono bg-black/30 px-2 py-1 rounded">Sort: ${p.sort}</span>
                        </div>
                        <p class="text-sm text-gray-400 mb-6 h-10 overflow-hidden line-clamp-2">${p.description || '暂无描述'}</p>
                        
                        <div class="flex justify-end gap-2 pt-4 border-t border-white/5 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editPost(${p.id})" class="p-2 text-primary hover:bg-primary/20 rounded-md transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            <button onclick="deletePost(${p.id})" class="p-2 text-red-400 hover:bg-red-500/20 rounded-md transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPostModal(post = null) {
            const isEdit = !!post;
            document.getElementById('modal-title').textContent = isEdit ? '编辑岗位' : '新增岗位';
            document.getElementById('form-id').value = isEdit ? post.id : '';
            document.getElementById('form-name').value = isEdit ? post.name : '';
            document.getElementById('form-desc').value = isEdit ? (post.description || '') : '';
            document.getElementById('form-sort').value = isEdit ? post.sort : '0';
            
            document.getElementById('form-error').classList.add('hidden');
            window.openModal('post-modal');
        }

        function editPost(id) {
            const post = allPosts.find(p => p.id === id);
            if (post) openPostModal(post);
        }

        async function submitPostForm() {
            const id = document.getElementById('form-id').value;
            const errorEl = document.getElementById('form-error');
            
            const payload = {
                name: document.getElementById('form-name').value,
                description: document.getElementById('form-desc').value,
                sort: parseInt(document.getElementById('form-sort').value) || 0
            };

            if (!payload.name) {
                errorEl.textContent = '名称为必填项';
                errorEl.classList.remove('hidden');
                return;
            }

            const endpoint = id ? '/postType/edit' : '/postType/add';
            if (id) payload.id = parseInt(id);

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost(endpoint, payload);
                window.closeModal('post-modal');
                loadPosts();
            } catch (err) {
                errorEl.textContent = err.message || '操作失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function deletePost(id) {
            if (!confirm('确定删除该岗位？')) return;
            try {
                await window.apiPost('/postType/delete', { id });
                loadPosts();
            } catch (e) { alert(e.message || '操作失败'); }
        }

        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
