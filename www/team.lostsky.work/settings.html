<body class="antialiased selection:bg-primary selection:text-white bg-[#020617] text-white flex h-screen overflow-hidden">

            <span class="text-xl font-bold tracking-wider">失落<span class="text-primary">青空</span>后台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 admin-scroll">
            <div class="px-3 mb-2">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">核心管理</p>
                <a href="/" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>仪表盘</a>
                <a href="/members" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>成员管理</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">团队配置</p>
                <a href="/posts" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>岗位类型</a>
                <a href="/fields" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>自定义字段</a>
                <a href="/files" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>文件库</a>
                <a href="/settings" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1 active"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>团队设置</a>
            </div>
            <div class="px-3 mb-2 mt-6">
                <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">个人中心</p>
                <a href="/me" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg text-sm text-gray-300 mb-1"><svg class="w-5 h-5 mr-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>我的资料</a>
            </div>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-white/5 glass-panel z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="md:hidden p-2 -ml-2 mr-2 text-gray-400 hover:text-white rounded-md hover:bg-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center text-sm">
                    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors">仪表盘</a>
                    <span class="mx-2 text-gray-600">/</span>
                    <span class="text-white font-medium">团队设置</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto admin-scroll p-4 sm:px-6 lg:px-8 py-8">
            <div class="fade-in-element max-w-3xl">
                
                <div class="mb-8">
                    <h2 class="text-2xl font-bold mb-1">团队基础设置</h2>
                    <p class="text-sm text-gray-400">配置团队全局生效的基础选项与信息。</p>
                </div>

                <div class="glass-panel rounded-3xl p-8 border border-white/5 relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-64 h-64 bg-secondary/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                    
                    <form id="settings-form" class="space-y-6 relative z-10">
                        <!-- App Name selector (用于区分不同业务的设置) -->
                        <div class="flex border-b border-white/10 mb-6">
                            <button type="button" class="px-4 py-2 border-b-2 border-primary text-primary font-medium">Index (核心配置)</button>
                            <!-- 可以扩展更多App的配置Tab -->
                        </div>

                        <!-- 动态生成的设置项容器 -->
                        <div id="settings-container" class="space-y-6">
                            <div class="text-gray-500 py-8 text-center">加载设置中...</div>
                        </div>

                        <div id="form-message" class="hidden p-3 rounded-lg text-sm"></div>

                        <div class="pt-6 border-t border-white/5 flex justify-end">
                            <button type="submit" class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-primary/20 tech-border-glow">
                                保存设置
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        const appName = 'index'; // 当前加载的配置域
        let currentSettings = {};

        // 默认预设我们需要配置的几个常见key，因为后端接口可能返回空或者很多不知道的key
        const PRESET_KEYS = [
            { key: 'team_name', label: '团队展示名称', type: 'text', placeholder: '如: 失落青空陪玩团' },
            { key: 'team_logo', label: '团队Logo URL', type: 'text', placeholder: 'https://...' },
            { key: 'allow_join', label: '允许外部申请加入', type: 'switch', default: 'true' },
            { key: 'contact_email', label: '联系邮箱', type: 'text', placeholder: 'admin@example.com' }
        ];

        async function loadSettings() {
            const container = document.getElementById('settings-container');
            try {
                // apiGet 返回的是 json.data，即设置对象
                const res = await window.apiGet('/setting?app=' + appName);
                currentSettings = res || {};
                renderSettingsForm();
            } catch (err) {
                container.innerHTML = `<div class="text-red-400">网络异常</div>`;
            }
        }

        function renderSettingsForm() {
            const container = document.getElementById('settings-container');
            let html = '';
            
            PRESET_KEYS.forEach(item => {
                // 读取后端已存值，如果没有则取默认或者空
                const val = currentSettings[item.key] !== undefined ? currentSettings[item.key] : (item.default || '');
                
                if (item.type === 'text') {
                    html += `
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">${item.label}</label>
                        <input type="text" id="setting-${item.key}" name="${item.key}" value="${val}" placeholder="${item.placeholder || ''}" 
                               class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary transition-colors placeholder-gray-600">
                    </div>`;
                } else if (item.type === 'switch') {
                    const isChecked = (val === 'true' || val === true || val === '1');
                    html += `
                    <div class="flex items-center justify-between py-2">
                        <label class="text-sm font-medium text-gray-300">${item.label}</label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="setting-${item.key}" name="${item.key}" class="sr-only peer" ${isChecked ? 'checked' : ''}>
                            <div class="page-team-switch"></div>
                        </label>
                    </div>`;
                }
            });

            container.innerHTML = html;
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('form-message');
            msgEl.className = 'hidden p-3 rounded-lg text-sm';
            
            // 收集数据
            const payloadSettings = {};
            PRESET_KEYS.forEach(item => {
                const el = document.getElementById(`setting-${item.key}`);
                if (item.type === 'switch') {
                    payloadSettings[item.key] = el.checked ? '1' : '0'; // 后端可能存字符串
                } else {
                    payloadSettings[item.key] = el.value;
                }
            });

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost('/setting', {
                    app_name: appName,
                    settings: payloadSettings
                });

                msgEl.textContent = '设置保存成功';
                msgEl.classList.add('bg-green-500/10', 'border', 'border-green-500/20', 'text-green-400');
                msgEl.classList.remove('hidden');
                setTimeout(() => msgEl.classList.add('hidden'), 3000);
            } catch (err) {
                msgEl.textContent = err.message || '网络请求失败';
                msgEl.classList.add('bg-red-500/10', 'border', 'border-red-500/20', 'text-red-400');
                msgEl.classList.remove('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
