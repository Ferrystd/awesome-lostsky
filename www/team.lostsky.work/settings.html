    <script src="//assets.lostsky.work/js/api.js"></script>
    <script src="//assets.lostsky.work/js/page-team.js"></script>
    <script>
        const appName = 'index'; // 当前加载的配置域
        let currentSettings = {};

        async function loadSettings() {
            const container = document.getElementById('settings-container');
            try {
                // apiGet 返回的是 json.data，即设置对象
                const res = await window.apiGet('/setting?app=' + appName);
                currentSettings = res || {};
                renderSettingsForm();
            } catch (err) {
                container.innerHTML = `<div class="text-red-400">网络异常</div>`;
            }
        }

        function renderSettingsForm() {
            const container = document.getElementById('settings-container');
            const entries = Object.entries(currentSettings);
            if (!entries.length) {
                container.innerHTML = '<div class="text-slate-500 py-8 text-center">暂无可配置项</div>';
                return;
            }

            const html = entries.map(([key, val]) => {
                const stringValue = String(val ?? '');
                const isSwitch = ['0', '1', 'true', 'false'].includes(stringValue.toLowerCase());
                if (isSwitch) {
                    const isChecked = stringValue === '1' || stringValue.toLowerCase() === 'true';
                    return `
                    <div class="flex items-center justify-between py-2">
                        <label class="text-sm font-medium text-slate-700">${escapeHtml(settingLabel(key))}</label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="setting-${escapeHtml(settingId(key))}" name="${escapeHtml(key)}" data-setting-key="${escapeHtml(key)}" data-setting-type="switch" class="sr-only peer" ${isChecked ? 'checked' : ''}>
                            <div class="page-team-switch"></div>
                        </label>
                    </div>`;
                }
                return `
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">${escapeHtml(settingLabel(key))}</label>
                    <input type="text" id="setting-${escapeHtml(settingId(key))}" name="${escapeHtml(key)}" value="${escapeHtml(stringValue)}" data-setting-key="${escapeHtml(key)}" data-setting-type="text"
                           class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-slate-950 focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-colors placeholder-slate-400">
                </div>`;
            }).join('');

            container.innerHTML = html;
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('form-message');
            msgEl.className = 'hidden p-3 rounded-lg text-sm';

            // 收集数据
            const payloadSettings = {};
            document.querySelectorAll('[data-setting-key]').forEach(el => {
                const key = el.dataset.settingKey;
                if (el.dataset.settingType === 'switch') {
                    payloadSettings[key] = el.checked ? '1' : '0';
                } else {
                    payloadSettings[key] = el.value;
                }
            });

            try {
                // apiPost 成功时返回 json.data，失败时抛 Error
                await window.apiPost('/setting', {
                    app_name: appName,
                    settings: payloadSettings
                });

                msgEl.textContent = '设置保存成功';
                msgEl.classList.add('bg-green-500/10', 'border', 'border-green-500/20', 'text-green-400');
                msgEl.classList.remove('hidden');
                setTimeout(() => msgEl.classList.add('hidden'), 3000);
            } catch (err) {
                msgEl.textContent = err.message || '网络请求失败';
                msgEl.classList.add('bg-red-500/10', 'border', 'border-red-500/20', 'text-red-400');
                msgEl.classList.remove('hidden');
            }
        });

        function settingLabel(key) {
            return String(key).replace(/_/g, ' ');
        }

        function settingId(key) {
            return String(key).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
