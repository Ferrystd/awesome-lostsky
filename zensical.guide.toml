[project]
site_name = "LostSky 使用指南"
site_url = "https://doc.lostsky.work"
site_description = "了解 Lostsky 的功能。"
site_author = "LostSky"
copyright = "Copyright &copy; 2026 LostSky"
docs_dir = "docs/user"
site_dir = "www/doc.lostsky.work"
extra_javascript = [
  { path = "javascripts/mermaid.js", type = "module" },
]
nav = [
  {"开始使用" = [
    "index.md",
    {"快速开始" = [
      {"团队" = "quickstart/team.md"}
    ]}
  ]},
  {"使用应用" = [
    "app/team.md",
    "app/chat.md",
    "app/shop.md",
    "app/display.md",
    "app/weibo.md",
    "app/team/webhook.md"
  ]},
  {"平台管理" = "app/admin.md"},
  {"概念与规则" = [
    {"人员与组织" = [
      "concept/user.md",
      "concept/entity.md",
      "concept/member.md",
      "concept/team.md",
      "concept/customer.md",
      "concept/virtual.md"
    ]},
    {"访问控制与标识" = [
      "concept/role.md",
      "concept/permission.md",
      "concept/ability.md",
      "concept/slug.md"
    ]},
    "glossarys.md"
  ]},
  {"参考与支持" = [
    "dictionary/abilities.md",
    "dictionary/permissions.md",
    "support.md",
    {"鸣谢" = "CONTRIBUTING.md"}
  ]}
]

[project.theme]
language = "zh"
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "content.tooltips",
  "content.code.copy"
]

[project.markdown_extensions]
attr_list = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
pymdownx.snippets.auto_append = [
  "docs/user/includes/apps.txt",
  "docs/user/includes/misc.txt",
  "docs/user/includes/references.txt"
]

[project.markdown_extensions.zensical_glossary_zh]
glossary_file = "glossarys.md"
inline_definitions = true
first_only = true

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["*.md", "**/*.md"]
